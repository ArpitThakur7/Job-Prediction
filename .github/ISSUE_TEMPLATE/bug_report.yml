name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Don't include your resume, API keys or personal details.**
        Security problems go through [private reporting](https://github.com/ArpitThakur7/Job-Prediction/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the job feed
        2. Set minimum fit to 60
        3. ...
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Web app, Salvo engine (scanning, tailoring), Prediction API, ML training, Setup / install]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Node 20, Python 3.12
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
